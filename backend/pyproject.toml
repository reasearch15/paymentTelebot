[project]
name = "payment-ledger-backend"
version = "0.1.0"
description = "FastAPI backend for Payment Ledger"
requires-python = ">=3.12"
dependencies = [
    "alembic>=1.13.2",
    "asyncpg>=0.29.0",
    "cryptography>=43.0.0",
    "email-validator>=2.2.0",
    "fastapi>=0.115.0",
    "itsdangerous>=2.2.0",
    "pydantic-settings>=2.4.0",
    "pwdlib[argon2]>=0.2.1",
    "python-dotenv>=1.0.1",
    "sqlalchemy[asyncio]>=2.0.32",
    "uvicorn[standard]>=0.30.6",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.3.0",
]

[tool.pytest.ini_options]
pythonpath = ["."]

[tool.setuptools.packages.find]
include = ["app*"]
